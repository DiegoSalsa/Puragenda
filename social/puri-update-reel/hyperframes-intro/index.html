<!doctype html>
<html lang="es" data-resolution="portrait">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; }
    body { background: #fffaf0; font-family: Arial, Helvetica, sans-serif; }
    #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #fffaf0; color: #171717; }
    .clip { position: absolute; }
    .orb { position: absolute; width: 1250px; height: 1250px; border: 7px solid #171717; border-radius: 50%; background: #c5a5ff; top: -610px; right: -560px; }
    .orb-small { position: absolute; width: 720px; height: 720px; border: 6px solid #171717; border-radius: 50%; background: #ffdb55; left: -455px; bottom: 130px; }
    .brand { top: 34px; left: 70px; width: 330px; height: 150px; object-fit: contain; object-position: left center; }
    .tag { top: 210px; left: 76px; padding: 19px 28px 17px; border: 5px solid #171717; border-radius: 100px; background: #ffdf5d; box-shadow: 8px 8px 0 #171717; font-weight: 900; letter-spacing: 4px; font-size: 25px; }
    .intro { top: 350px; left: 78px; width: 920px; font-size: 74px; font-weight: 900; letter-spacing: -3px; line-height: .99; }
    .halo { top: 510px; left: 173px; width: 740px; height: 740px; border-radius: 50%; border: 30px solid #ffdb55; }
    .halo:after { content: ''; position: absolute; inset: 42px; border: 3px dashed rgba(23,23,23,.22); border-radius: 50%; }
    .puri-wrap { top: 540px; left: 160px; width: 765px; height: 765px; object-fit: contain; filter: drop-shadow(0 25px 0 rgba(93, 45, 164, .2)); }
    .spark { width: 24px; height: 105px; border-radius: 20px; background: #7c3aed; border: 4px solid #171717; }
    .spark.one { top: 500px; left: 855px; transform: rotate(30deg); }
    .spark.two { top: 680px; left: 112px; transform: rotate(-42deg); background: #ffdb55; }
    .word { top: 1285px; left: 76px; width: 930px; height: 245px; display: flex; align-items: center; justify-content: center; border: 7px solid #171717; border-radius: 50px; background: #7c3aed; box-shadow: 18px 18px 0 #171717; color: #fff; font-size: 217px; font-weight: 900; letter-spacing: -17px; line-height: 1; }
    .tagline { top: 1585px; left: 120px; width: 840px; text-align: center; font-size: 56px; font-weight: 800; line-height: 1.13; letter-spacing: -2.8px; }
    .tagline span { color: #7c3aed; display: block; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1080" data-height="1920">
    <div class="orb" data-layout-allow-overflow></div><div class="orb-small" data-layout-allow-overflow></div>
    <img id="brand" class="brand clip" data-start="0" data-duration="3" data-track-index="0" src="assets/puragenda-logo.svg" alt="puragenda" />
    <div id="tag" class="tag clip" data-start="0" data-duration="3" data-track-index="1">NUEVO EN PURAGENDA</div>
    <div id="intro" class="intro clip" data-start="0" data-duration="3" data-track-index="2">Te presentamos a</div>
    <div id="halo" class="halo clip" data-start="0" data-duration="3" data-track-index="3"></div>
    <img id="puri" class="puri-wrap clip" data-start="0" data-duration="3" data-track-index="4" src="assets/puri-greeting.svg" alt="Puri, mascota de Puragenda" />
    <div id="spark1" class="spark one clip" data-start="0" data-duration="3" data-track-index="5"></div>
    <div id="spark2" class="spark two clip" data-start="0" data-duration="3" data-track-index="5"></div>
    <div id="word" class="word clip" data-start="0" data-duration="3" data-track-index="6">PURI</div>
    <div id="tagline" class="tagline clip" data-start="0" data-duration="3" data-track-index="7">Tu asistente de siempre<span>en Puragenda</span></div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    tl.fromTo('#brand', { opacity: 0, x: -35 }, { opacity: 1, x: 0, duration: .2, ease: 'power2.out' }, 0);
    tl.fromTo('#puri', { opacity: 0, y: 85, scale: .86, rotation: -7 }, { opacity: 1, y: 0, scale: 1, rotation: 0, duration: .62, ease: 'back.out(1.35)' }, .04);
    tl.fromTo('#tag', { opacity: 0, y: -28 }, { opacity: 1, y: 0, duration: .28, ease: 'power2.out' }, .10);
    tl.fromTo('#intro', { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: .34, ease: 'power3.out' }, .22);
    tl.fromTo('#halo', { opacity: 0, scale: .75, rotation: -14 }, { opacity: 1, scale: 1, rotation: 0, duration: .42, ease: 'power2.out' }, .20);
    tl.fromTo('#word', { opacity: 0, y: 90, scale: .9 }, { opacity: 1, y: 0, scale: 1, duration: .42, ease: 'back.out(1.6)' }, .72);
    tl.fromTo('#tagline', { opacity: 0, y: 35 }, { opacity: 1, y: 0, duration: .34, ease: 'power3.out' }, 1.32);
    ['#spark1','#spark2'].forEach((s, i) => tl.fromTo(s, { opacity: 0, scale: .2 }, { opacity: 1, scale: 1, duration: .25, ease: 'back.out(2)' }, .75 + i * .12));
    window.__timelines = window.__timelines || {};
    window.__timelines.main = tl;
  </script>
</body>
</html>
